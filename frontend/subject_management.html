<script>
    document.addEventListener("DOMContentLoaded", function() {
        const API_URL = "http://127.0.0.1:5000/api";
        
        // DOM Elements
        const subjectsContainer = document.getElementById('subjects-container');
        const searchInput = document.getElementById('search-input');
        const filterSubject = document.getElementById('filter-subject');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        const createSubjectBtn = document.getElementById('create-subject-btn');
        
        // Modal elements
        const modalSubject = document.getElementById('modal-subject');
        const modalChapter = document.getElementById('modal-chapter');
        const modalSection = document.getElementById('modal-section');
        
        // State management
        let allSubjects = [];
        let filteredSubjects = [];
        let expandedSubjects = new Set(); // Track expanded subjects
        let subjectChapters = {}; // Cache: subject_id -> chapters
        let chapterSections = {}; // Cache: chapter_id -> sections
        
        // ============================================================
        // HÀM: LẤY DANH SÁCH SUBJECTS
        // ============================================================
        function loadSubjects() {
            subjectsContainer.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center py-12 text-slate-500 dark:text-slate-400">
                    <span class="material-symbols-outlined animate-spin text-4xl mb-4">sync</span>
                    <span>Đang tải dữ liệu...</span>
                </div>
            `;
            
            fetch(`${API_URL}/get-all-subjects`)
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }
                    return res.json();
                })
                .then(data => {
                    console.log("API Response:", data);
                    // Xử lý cả 2 trường hợp: {subjects: [...]} hoặc [{...}]
                    if (data.subjects && Array.isArray(data.subjects)) {
                        allSubjects = data.subjects;
                    } else if (Array.isArray(data)) {
                        allSubjects = data;
                    } else if (data.error) {
                        console.error("API Error:", data.error);
                        allSubjects = [];
                    } else {
                        console.warn("Unexpected data format:", data);
                        allSubjects = [];
                    }
                    console.log("Loaded subjects:", allSubjects);
                    populateFilterDropdown();
                    applyFilters();
                })
                .catch(err => {
                    console.error("Lỗi khi tải subjects:", err);
                    allSubjects = [];
                    populateFilterDropdown();
                    applyFilters();
                });
        }
        
        // ============================================================
        // HÀM: LẤY CHƯƠNG CỦA MÔN HỌC
        // ============================================================
        function loadChapters(subjectId) {
            if (subjectChapters[subjectId]) {
                return Promise.resolve(subjectChapters[subjectId]);
            }
            
            return fetch(`${API_URL}/subjects/${subjectId}/chapters`)
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }
                    return res.json();
                })
                .then(data => {
                    console.log(`Chapters for subject ${subjectId}:`, data);
                    const chapters = data.chapters || data || [];
                    subjectChapters[subjectId] = chapters;
                    return chapters;
                })
                .catch(err => {
                    console.error("Lỗi khi tải chapters:", err);
                    return [];
                });
        }
        
        // ============================================================
        // HÀM: LẤY MỤC CỦA CHƯƠNG
        // ============================================================
        function loadSections(chapterId) {
            if (chapterSections[chapterId]) {
                return Promise.resolve(chapterSections[chapterId]);
            }
            
            return fetch(`${API_URL}/chapters/${chapterId}/sections`)
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }
                    return res.json();
                })
                .then(data => {
                    console.log(`Sections for chapter ${chapterId}:`, data);
                    const sections = data.sections || data || [];
                    chapterSections[chapterId] = sections;
                    return sections;
                })
                .catch(err => {
                    console.error("Lỗi khi tải sections:", err);
                    return [];
                });
        }
        
        // ============================================================
        // HÀM: RENDER SUBJECT CARD VỚI EXPAND INLINE
        // ============================================================
        function renderSubjects() {
            subjectsContainer.innerHTML = '';
            
            if (filteredSubjects.length === 0) {
                subjectsContainer.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-12 text-slate-500 dark:text-slate-400">
                        <span class="material-symbols-outlined text-4xl mb-4">search_off</span>
                        <span>Không tìm thấy môn học nào phù hợp với điều kiện lọc.</span>
                    </div>
                `;
                return;
            }
            
            filteredSubjects.forEach(subject => {
                const card = document.createElement('div');
                card.className = 'col-span-full sm:col-span-2 lg:col-span-3 xl:col-span-4';
                card.setAttribute('data-subject-id', subject.id);
                
                const isExpanded = expandedSubjects.has(subject.id);
                
                card.innerHTML = `
                    <div class="bg-white dark:bg-[#1e293b] rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                        <!-- Subject Header -->
                        <div class="p-6 flex items-center justify-between cursor-pointer" onclick="toggleSubject(${subject.id})">
                            <div class="flex items-center gap-4">
                                <span class="material-symbols-outlined text-primary transition-transform ${isExpanded ? 'rotate-90' : ''}">chevron_right</span>
                                <div>
                                    <h3 class="text-lg font-bold text-slate-900 dark:text-white">${subject.name}</h3>
                                    ${subject.code ? `<span class="text-xs text-slate-500 dark:text-slate-400 font-mono">${subject.code}</span>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="event.stopPropagation(); openCreateChapterModal(${subject.id})" class="p-2 rounded-lg text-slate-400 hover:text-primary hover:bg-primary/10 transition-colors" title="Thêm chương">
                                    <span class="material-symbols-outlined text-[18px]">add</span>
                                </button>
                                <button onclick="event.stopPropagation(); editSubject(${subject.id})" class="p-2 rounded-lg text-slate-400 hover:text-primary hover:bg-primary/10 transition-colors" title="Chỉnh sửa">
                                    <span class="material-symbols-outlined text-[18px]">edit</span>
                                </button>
                                <button onclick="event.stopPropagation(); deleteSubject(${subject.id})" class="p-2 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-500/10 transition-colors" title="Xóa">
                                    <span class="material-symbols-outlined text-[18px]">delete</span>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Expanded Content (Chapters & Sections) -->
                        <div class="subject-content px-6 pb-6 ${isExpanded ? '' : 'hidden'}" id="subject-content-${subject.id}">
                            <div class="loading-chapters text-center py-4 text-slate-500 dark:text-slate-400">
                                <span class="material-symbols-outlined animate-spin">sync</span> Đang tải...
                            </div>
                        </div>
                    </div>
                `;
                
                subjectsContainer.appendChild(card);
                
                // Load chapters nếu đã expanded
                if (isExpanded) {
                    renderSubjectContent(subject.id);
                }
            });
        }
        
        // ============================================================
        // HÀM: RENDER NỘI DUNG MÔN HỌC (Chapters & Sections)
        // ============================================================
        function renderSubjectContent(subjectId) {
            const contentDiv = document.getElementById(`subject-content-${subjectId}`);
            if (!contentDiv) return;
            
            loadChapters(subjectId).then(chapters => {
                if (chapters.length === 0) {
                    contentDiv.innerHTML = `
                        <div class="text-center py-8 text-slate-500 dark:text-slate-400">
                            <p>Chưa có chương nào. Nhấn nút "Thêm chương" để tạo mới.</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '<div class="space-y-4">';
                
                chapters.forEach(chapter => {
                    html += `
                        <div class="border border-slate-200 dark:border-slate-700 rounded-lg p-4">
                            <div class="flex items-center justify-between mb-2">
                                <h4 class="font-semibold text-slate-900 dark:text-white">${chapter.name}</h4>
                                <div class="flex gap-2">
                                    <button onclick="openCreateSectionModal(${chapter.id})" class="p-1.5 rounded text-xs text-slate-400 hover:text-primary hover:bg-primary/10" title="Thêm mục">
                                        <span class="material-symbols-outlined text-[16px]">add</span>
                                    </button>
                                    <button onclick="editChapter(${chapter.id})" class="p-1.5 rounded text-slate-400 hover:text-primary hover:bg-primary/10">
                                        <span class="material-symbols-outlined text-[16px]">edit</span>
                                    </button>
                                    <button onclick="deleteChapter(${chapter.id})" class="p-1.5 rounded text-slate-400 hover:text-red-500 hover:bg-red-500/10">
                                        <span class="material-symbols-outlined text-[16px]">delete</span>
                                    </button>
                                </div>
                            </div>
                            <div class="sections-container mt-3" id="sections-${chapter.id}">
                                <div class="text-xs text-slate-500">Đang tải mục...</div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                contentDiv.innerHTML = html;
                
                // Load sections cho từng chapter
                chapters.forEach(chapter => {
                    loadSections(chapter.id).then(sections => {
                        renderSections(chapter.id, sections);
                    });
                });
            });
        }
        
        // ============================================================
        // HÀM: RENDER SECTIONS (MỤC)
        // ============================================================
        function renderSections(chapterId, sections) {
            const sectionsDiv = document.getElementById(`sections-${chapterId}`);
            if (!sectionsDiv) return;
            
            if (sections.length === 0) {
                sectionsDiv.innerHTML = '<div class="text-xs text-slate-500 dark:text-slate-400 italic">Chưa có mục nào.</div>';
                return;
            }
            
            let html = '<div class="space-y-2">';
            sections.forEach(section => {
                html += `
                    <a href="Template_management.html?category_id=${section.id}" class="flex items-center justify-between p-2 rounded hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors group">
                        <span class="text-sm text-slate-700 dark:text-slate-300">${section.name}</span>
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="event.preventDefault(); editSection(${section.id})" class="p-1 rounded text-slate-400 hover:text-primary">
                                <span class="material-symbols-outlined text-[14px]">edit</span>
                            </button>
                            <button onclick="event.preventDefault(); deleteSection(${section.id})" class="p-1 rounded text-slate-400 hover:text-red-500">
                                <span class="material-symbols-outlined text-[14px]">delete</span>
                            </button>
                        </div>
                    </a>
                `;
            });
            html += '</div>';
            sectionsDiv.innerHTML = html;
        }
        
        // ============================================================
        // HÀM: TOGGLE SUBJECT EXPAND
        // ============================================================
        window.toggleSubject = function(subjectId) {
            if (expandedSubjects.has(subjectId)) {
                expandedSubjects.delete(subjectId);
            } else {
                expandedSubjects.add(subjectId);
            }
            renderSubjects();
        };
        
        // ============================================================
        // HÀM: MODAL HANDLERS
        // ============================================================
        function openSubjectModal(subjectId = null) {
            const form = document.getElementById('form-subject');
            const title = document.getElementById('modal-subject-title');
            
            if (subjectId) {
                const subject = allSubjects.find(s => s.id === subjectId);
                if (subject) {
                    title.textContent = 'Chỉnh sửa môn học';
                    document.getElementById('subject-id').value = subject.id;
                    document.getElementById('subject-name').value = subject.name;
                    document.getElementById('subject-code').value = subject.code || '';
                    document.getElementById('subject-description').value = subject.description || '';
                }
            } else {
                title.textContent = 'Tạo môn học mới';
                form.reset();
                document.getElementById('subject-id').value = '';
            }
            
            modalSubject.classList.remove('hidden');
            modalSubject.classList.add('flex');
        }
        
        function closeSubjectModal() {
            modalSubject.classList.add('hidden');
            modalSubject.classList.remove('flex');
        }
        
        function openCreateChapterModal(subjectId) {
            document.getElementById('chapter-subject-id').value = subjectId;
            modalChapter.classList.remove('hidden');
            modalChapter.classList.add('flex');
        }
        
        window.openCreateChapterModal = openCreateChapterModal;
        
        function closeChapterModal() {
            modalChapter.classList.add('hidden');
            modalChapter.classList.remove('flex');
            document.getElementById('form-chapter').reset();
        }
        
        function openCreateSectionModal(chapterId) {
            document.getElementById('section-chapter-id').value = chapterId;
            modalSection.classList.remove('hidden');
            modalSection.classList.add('flex');
        }
        
        window.openCreateSectionModal = openCreateSectionModal;
        
        function closeSectionModal() {
            modalSection.classList.add('hidden');
            modalSection.classList.remove('flex');
            document.getElementById('form-section').reset();
        }
        
        // ============================================================
        // HÀM: CRUD OPERATIONS
        // ============================================================
        window.editSubject = function(subjectId) {
            openSubjectModal(subjectId);
        };
        
        window.deleteSubject = function(subjectId) {
            if (!confirm('Bạn có chắc chắn muốn xóa môn học này?')) return;
            
            fetch(`${API_URL}/subjects/${subjectId}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        loadSubjects();
                    } else {
                        alert(data.error || 'Xóa môn học thất bại.');
                    }
                })
                .catch(err => {
                    console.error('Lỗi khi xóa môn học:', err);
                    alert('Lỗi kết nối server.');
                });
        };
        
        window.editChapter = function(chapterId) {
            alert('Chức năng chỉnh sửa chương sẽ được thêm sau.');
        };
        
        window.deleteChapter = function(chapterId) {
            if (!confirm('Bạn có chắc chắn muốn xóa chương này?')) return;
            
            fetch(`${API_URL}/categories/${chapterId}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        // Clear cache và reload
                        Object.keys(subjectChapters).forEach(sid => {
                            subjectChapters[sid] = subjectChapters[sid].filter(c => c.id !== chapterId);
                        });
                        renderSubjects();
                    } else {
                        alert(data.error || 'Xóa chương thất bại.');
                    }
                })
                .catch(err => {
                    console.error('Lỗi khi xóa chương:', err);
                    alert('Lỗi kết nối server.');
                });
        };
        
        window.editSection = function(sectionId) {
            alert('Chức năng chỉnh sửa mục sẽ được thêm sau.');
        };
        
        window.deleteSection = function(sectionId) {
            if (!confirm('Bạn có chắc chắn muốn xóa mục này?')) return;
            
            fetch(`${API_URL}/categories/${sectionId}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        // Clear cache và reload
                        Object.keys(chapterSections).forEach(cid => {
                            chapterSections[cid] = chapterSections[cid].filter(s => s.id !== sectionId);
                        });
                        renderSubjects();
                    } else {
                        alert(data.error || 'Xóa mục thất bại.');
                    }
                })
                .catch(err => {
                    console.error('Lỗi khi xóa mục:', err);
                    alert('Lỗi kết nối server.');
                });
        };
        
        // ============================================================
        // FORM SUBMISSIONS
        // ============================================================
        document.getElementById('form-subject').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const subjectId = formData.get('id');
            const payload = {
                name: formData.get('name'),
                code: formData.get('code'),
                description: formData.get('description')
            };
            
            const url = subjectId ? `${API_URL}/subjects/${subjectId}` : `${API_URL}/subjects`;
            const method = subjectId ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success || data.subject) {
                    closeSubjectModal();
                    loadSubjects();
                } else {
                    alert(data.error || 'Lưu môn học thất bại.');
                }
            })
            .catch(err => {
                console.error('Lỗi khi lưu môn học:', err);
                alert('Lỗi kết nối server.');
            });
        });
        
        document.getElementById('form-chapter').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const subjectId = formData.get('subject_id');
            const payload = {
                name: formData.get('name'),
                description: formData.get('description')
            };
            
            fetch(`${API_URL}/subjects/${subjectId}/chapters`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success || data.chapter) {
                    closeChapterModal();
                    // Clear cache và reload
                    delete subjectChapters[subjectId];
                    renderSubjects();
                } else {
                    alert(data.error || 'Tạo chương thất bại.');
                }
            })
            .catch(err => {
                console.error('Lỗi khi tạo chương:', err);
                alert('Lỗi kết nối server.');
            });
        });
        
        document.getElementById('form-section').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const chapterId = formData.get('chapter_id');
            const payload = {
                name: formData.get('name'),
                description: formData.get('description')
            };
            
            fetch(`${API_URL}/chapters/${chapterId}/sections`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success || data.section) {
                    closeSectionModal();
                    // Clear cache và reload
                    delete chapterSections[chapterId];
                    renderSubjects();
                } else {
                    alert(data.error || 'Tạo mục thất bại.');
                }
            })
            .catch(err => {
                console.error('Lỗi khi tạo mục:', err);
                alert('Lỗi kết nối server.');
            });
        });
        
        // ============================================================
        // MODAL CLOSE HANDLERS
        // ============================================================
        document.getElementById('modal-subject-close').addEventListener('click', closeSubjectModal);
        document.getElementById('modal-subject-cancel').addEventListener('click', closeSubjectModal);
        document.getElementById('modal-chapter-close').addEventListener('click', closeChapterModal);
        document.getElementById('modal-chapter-cancel').addEventListener('click', closeChapterModal);
        document.getElementById('modal-section-close').addEventListener('click', closeSectionModal);
        document.getElementById('modal-section-cancel').addEventListener('click', closeSectionModal);
        
        // Close modal khi click outside
        [modalSubject, modalChapter, modalSection].forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    if (modal === modalSubject) closeSubjectModal();
                    else if (modal === modalChapter) closeChapterModal();
                    else if (modal === modalSection) closeSectionModal();
                }
            });
        });
        
        // ============================================================
        // OTHER FUNCTIONS
        // ============================================================
        function populateFilterDropdown() {
            filterSubject.innerHTML = '<option value="all">Lọc theo môn học</option>';
            allSubjects.forEach(subject => {
                const option = document.createElement('option');
                option.value = subject.id;
                option.textContent = subject.name;
                filterSubject.appendChild(option);
            });
        }
        
        function applyFilters() {
            console.log("applyFilters called, allSubjects:", allSubjects);
            const keyword = searchInput.value.trim().toLowerCase();
            const selectedSubjectId = filterSubject.value;
            
            filteredSubjects = allSubjects.filter(subject => {
                const matchesSearch = !keyword || (subject.name && subject.name.toLowerCase().includes(keyword));
                const matchesFilter = selectedSubjectId === 'all' || selectedSubjectId === '' || String(subject.id) === String(selectedSubjectId);
                return matchesSearch && matchesFilter;
            });
            
            console.log("filteredSubjects:", filteredSubjects);
            renderSubjects();
        }
        
        function toggleClearButton() {
            if (searchInput.value.trim()) {
                clearSearchBtn.style.display = 'flex';
                clearSearchBtn.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                clearSearchBtn.style.display = 'none';
                clearSearchBtn.classList.add('opacity-0', 'pointer-events-none');
            }
        }
        
        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        searchInput.addEventListener('input', () => {
            toggleClearButton();
            applyFilters();
        });
        
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                applyFilters();
            }
        });
        
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            toggleClearButton();
            applyFilters();
        });
        
        filterSubject.addEventListener('change', () => {
            applyFilters();
        });
        
        createSubjectBtn.addEventListener('click', () => {
            openSubjectModal();
        });
        
        // ============================================================
        // KHỞI TẠO
        // ============================================================
        loadSubjects();
    });
</script>
</body></html>
